networks:
  default:
    external: true
    name: cvdp-bridge-cvdp_v1-1-0_agentic_code_generation_no_commercial-64
services:
  test_poly_decimator:
    command: pytest --log-cli-level=INFO -o cache_dir=/code/rundir/.cache /src/test_poly_decimator/test_runner.py
      -v -s
    env_file: ./src/test_poly_decimator/.env
    image: nvidia/cvdp-sim:v1.0.0
    volumes:
    - ./src/:/src/:ro
    working_dir: /code/rundir
