networks:
  default:
    external: true
    name: cvdp-bridge-cvdp_v1-1-0_agentic_code_generation_no_commercial-64
services:
  1-new-tb:
    command: pytest -s -o cache_dir=/code/rundir/.cache /src/test_runner.py -v
    env_file: ./src/.env
    image: nvidia/cvdp-sim:v1.0.0
    volumes:
    - ./src/:/src/:ro
