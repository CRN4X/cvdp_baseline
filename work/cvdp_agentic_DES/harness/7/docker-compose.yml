networks:
  default:
    external: true
    name: cvdp-bridge-cvdp_v1-1-0_agentic_code_generation_no_commercial-64
services:
  des_dec:
    command: pytest /src/test_runner.py -s -v -o cache_dir=/rundir/harness/.cache
    env_file: ./src/.env_des_dec
    image: nvidia/cvdp-sim:v1.0.0
    volumes:
    - ./src:/src/
    working_dir: /code/rundir
  des_enc:
    command: pytest /src/test_runner.py -s -v -o cache_dir=/rundir/harness/.cache
    env_file: ./src/.env_des_enc
    image: nvidia/cvdp-sim:v1.0.0
    volumes:
    - ./src:/src/
    working_dir: /code/rundir
  sanity:
    command: pytest /src/test_runner.py -s -v -o cache_dir=/rundir/harness/.cache
    env_file: ./src/.env
    image: nvidia/cvdp-sim:v1.0.0
    volumes:
    - ./src:/src/
    working_dir: /code/rundir
